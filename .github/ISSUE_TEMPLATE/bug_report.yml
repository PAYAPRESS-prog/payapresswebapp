name: 🐞 Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Web (browser), Windows app, Android app, iOS app, Public API]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App / OS version
      placeholder: "e.g. Windows app v1.0.2 on Windows 11 · Chrome 126 · Android 14"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: Steps to reproduce…
    validations: { required: true }
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / console output
      description: Anything that helps us see it (drag & drop images here).
