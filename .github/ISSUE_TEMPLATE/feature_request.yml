name: 💡 Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Calculator, Waste calculator, EPLAN panel tool, Accounts/History, Windows app, Android app, iOS app, API, Other]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: As a panel builder, I need…
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
