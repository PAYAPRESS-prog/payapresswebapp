# Builds the official Android app for Busbar Calculator (TWA).
# Trigger: push a tag like `android-v1.0.0`, or run manually with a tag input.
# Outputs on the GitHub Release, with stable names the /download page links to:
#   Busbar-Calculator.apk   (universal APK — direct download / sideload)
#   Busbar-Calculator.aab   (app bundle — upload this one to Google Play)
#   SHA256SUMS-android.txt
#
# Signing: repo secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD. Without them the build is
# debug-signed and the release is marked as a pre-release.
name: Release Android app

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach artifacts to (e.g. android-v1.0.0)'
        required: true
        default: 'android-v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (pinned)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore keystore from secrets
        if: env.HAS_KEYSTORE == 'true'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon "assembleRelease" "bundleRelease"

      - name: Stage artifacts with stable names
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release*.apk dist/Busbar-Calculator.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/Busbar-Calculator.aab
          (cd dist && sha256sum * > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Manual runs attach to the tag given as input; tag pushes use the ref.
          name: "Busbar Calculator for Android ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
