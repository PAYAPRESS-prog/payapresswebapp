name: CI

# Safety net: every push runs the full check suite. Hostinger deploys the
# committed .next/ regardless, so a red run here is the alarm bell that the
# deployed commit is broken — fix forward or revert immediately.
on:
  push:
    branches: ['claude/**', main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Smoke tests (real component flows)
        run: npm run test:smoke

      - name: Build
        run: npm run build
