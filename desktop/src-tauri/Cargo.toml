[package]
name = "busbar-calculator"
version = "1.0.1"
description = "Busbar Calculator — official Windows app (remote shell)"
authors = ["Busbar Calculator — Payapress"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
url = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
