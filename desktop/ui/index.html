<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Busbar Calculator</title>
<style>
  html,body{margin:0;height:100%;background:#0d0e10;color:#f5f7fa;
    font-family:'Segoe UI',system-ui,sans-serif;display:flex;
    align-items:center;justify-content:center}
  .box{text-align:center;padding:24px;max-width:360px}
  .bar{width:46px;height:120px;margin:0 auto 18px;border-radius:8px;
    background:linear-gradient(160deg,#f7941d,#d71920);
    box-shadow:0 14px 40px rgba(215,25,32,.35);position:relative}
  .bar::after{content:'';position:absolute;left:10px;top:22px;width:26px;height:8px;
    border-radius:4px;background:rgba(13,14,16,.35)}
  h1{font-size:18px;margin:0 0 6px}
  p{font-size:13.5px;line-height:1.6;color:#9aa0aa;margin:0 0 18px}
  button{padding:11px 26px;border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(90deg,#f7941d,#d71920);color:#fff;
    font-size:14px;font-weight:700;font-family:inherit}
  #status{display:none}
  .offline #loading{display:none}
  .offline #status{display:block}
  .pulse{animation:p 1.4s ease-in-out infinite}
  @keyframes p{50%{opacity:.55}}
</style>
</head>
<body>
<div class="box" id="root">
  <div class="bar pulse"></div>
  <div id="loading"><h1>Busbar Calculator</h1><p>Connecting to live prices…</p></div>
  <div id="status">
    <h1>You're offline</h1>
    <p>Busbar Calculator needs an internet connection for live copper &amp;
       aluminum prices. Check your network and try again.</p>
    <button onclick="go()">Retry</button>
  </div>
</div>
<script>
  var APP = 'https://calculator.payapress.com/busbar-calculator?src=windows-app';
  function go() {
    document.getElementById('root').classList.remove('offline');
    // Connectivity ping with a tight timeout, then hand over to the live
    // app. mode:'no-cors' — this page runs on tauri.localhost, so a normal
    // cross-origin fetch would be CORS-blocked and read as "offline" even
    // with a perfect connection; an opaque response is enough as a probe
    // (only real network failures reject).
    var ctl = new AbortController();
    var t = setTimeout(function(){ ctl.abort(); }, 6000);
    fetch('https://calculator.payapress.com/manifest.json', {signal: ctl.signal, cache: 'no-store', mode: 'no-cors'})
      .then(function(){ clearTimeout(t); location.replace(APP); })
      .catch(function(){ clearTimeout(t); document.getElementById('root').classList.add('offline'); });
  }
  go();
</script>
</body>
</html>
