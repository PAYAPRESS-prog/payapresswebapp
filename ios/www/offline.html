<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Busbar Calculator</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;color:#f5f7fa;
    font-family:-apple-system,system-ui,sans-serif;display:flex;
    align-items:center;justify-content:center}
  .box{text-align:center;padding:24px;max-width:340px}
  .bar{width:46px;height:120px;margin:0 auto 18px;border-radius:8px;
    background:linear-gradient(160deg,#f7941d,#d71920);
    box-shadow:0 14px 40px rgba(215,25,32,.35)}
  h1{font-size:18px;margin:0 0 6px}
  p{font-size:13.5px;line-height:1.6;color:#9aa0aa;margin:0 0 18px}
  button{padding:12px 28px;border:none;border-radius:999px;
    background:linear-gradient(90deg,#f7941d,#d71920);color:#fff;
    font-size:15px;font-weight:700;font-family:inherit}
</style>
</head>
<body>
<div class="box">
  <div class="bar"></div>
  <h1>You're offline</h1>
  <p>Busbar Calculator needs an internet connection for live copper &amp;
     aluminum prices. Check your network and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
